    </div>`; } },

{ id:'crossshard', kick:'joins that leave the database', eyebrow:'Pitfall 1 · challenges of sharding', title:'Cross-shard queries',
  tag:'pitfalls', steps:[
  {note:'When a query joins or aggregates data living on multiple shards, the application must fetch from each and combine in memory.'},
  {note:'That is an application-level join, and it is far slower than a native SQL join. Suppose customers are sharded by customer_id but orders by order_id — one customer\'s orders are then spread across every shard. A one-to-many join that took milliseconds in a single instance now takes seconds.'}],
  body:(st)=>`<div class="stage-row">${sceneScatter(st+1)}</div>
    ${st>=1?`<p class="lede pop"><b>The mistake:</b> customers sharded by <code>customer_id</code>, orders by <code>order_id</code>.
      To report customers with their orders the app queries every shard, collects, and merges.</p>`:''}` },

{ id:'reshard', kick:'redistributing data on a live system', eyebrow:'Pitfall 2 · challenges of sharding', title:'Re-sharding',
  tag:'pitfalls', steps:[
  {note:'Data grows, you add a shard. Now the shard map has changed, and existing data has to be redistributed to match it.'},
  {note:'With hash sharding especially, adding one node changes the modulus and therefore where almost every row belongs.'},
  {note:'Re-sharding is expensive, complex, and risky to perform on a live production system. This is why the shard key and the shard count deserve real thought up front.'}],
  body:(st)=>`<div class="stage-row">${sceneReshard(st+1)}</div>` },

{ id:'hotspot', kick:'one shard saturated, nine idle', eyebrow:'Pitfall 3 · a poor shard key in action', title:'Hotspots',
  tag:'pitfalls', steps:[
  {note:'Suppose the orders table is sharded on order_date, with range sharding. It looks reasonable — orders are naturally time-ordered.'},
  {note:'The 2023 shard is idle. Nobody queries two-year-old orders.'},
  {note:'2024 is idle too.'},
  {note:'Early 2025 gets light traffic.'},
  {note:'And every single order placed today lands on the newest shard. It is at a hundred percent while every other machine you paid for does nothing. That is the hotspot problem — and it comes directly from the shard key choice.'}],
  body:(st)=>`<div class="stage-row">${sceneHotspot(st+1)}</div>` },

{ id:'whenshard', kick:'the decision, not the mechanism', eyebrow:'Where you should — and should not — shard',
  title:'When to reach for sharding', tag:'judgement', steps:[
  {note:'Three conditions, and you want all three before you shard. First: writes. A single primary cannot be scaled by adding replicas, so if WRITE throughput is the wall, sharding is one of the few real answers.'},
  {note:'Second: size. The working set no longer fits on the largest machine you can economically buy or operate.'},
  {note:'Third, and the one people forget: you must have a key that almost every query already carries. Tenant ID, user ID, workspace ID. Without it, every query becomes scatter-gather and you have made things worse.'},
  {note:'Now the counter-cases. If READS are the bottleneck, add replicas — far cheaper and reversible. If you can still scale up, do that first. If you have no natural shard key, sharding will hurt. And if your workload genuinely needs cross-entity transactions and joins, sharding takes those away from you.'}],
  body:(st)=>`<div class="cards" style="grid-template-columns:1fr 1fr;gap:.55rem">
    <div style="grid-column:1/-1" class="pop">${card('Shard when all three are true','Writes are the wall',
      'A single primary cannot absorb the write throughput — and replicas do not help with writes.','good',ico('bolt'))}</div>
    ${st>=1?`<div class="pop">${card('Condition 2','The data outgrew the machine',
      'The working set no longer fits on the largest machine you can economically buy and operate.','good',ico('db'))}</div>`:''}
    ${st>=2?`<div class="pop">${card('Condition 3','You have a natural key',
      'Tenant, user or workspace ID — carried by nearly every query, so most stay on one shard.','good',ico('route'))}</div>`:''}
    ${st>=3?`<div style="grid-column:1/-1" class="pop">${card('Do not shard when','Any one of these is true',
      'Reads are the bottleneck — use replicas. You can still scale up. There is no natural shard key. Or your workload needs cross-entity joins and transactions, which sharding takes away.','warn',ico('ban'))}</div>`:''}
  </div>` },

{ id:'quiz2', kick:'check your understanding', eyebrow:'Check yourself', title:'Sharding checkpoint',
  tag:'checkpoint', steps:[
  {note:'Three questions. Ask all three, take answers, then reveal.'},
  {note:'One: the shard key decides which shard each row lands on. A poor key produces imbalanced shards and hotspots — the single most critical sharding decision.'},
  {note:'Two: hashing spreads new writes evenly across all shards, avoiding the hotspot that range sharding creates on the newest-value shard.'},
  {note:'Three: a scatter-gather query hits every shard and merges the results. It commonly occurs with hash-based sharding, on range queries.'}],
  body:(st)=>{
    const qs=[['What is the role of the shard key, and why is choosing it correctly so important?',
        'It decides which shard each row lands on. A poor key produces imbalanced shards and hotspots — the single most critical sharding decision.'],
      ['Why prefer hash over range for a high-write orders table?',
        'Hashing spreads new writes evenly across all shards, avoiding the hotspot that range sharding creates on the newest-value shard.'],
      ['What is a scatter–gather query, and under which strategy does it occur?',
        'A query that must hit every shard and merge results. It commonly occurs with hash-based sharding, on range queries.']];
    return `<div class="cards" style="gap:.5rem">
      ${qs.map((q,i)=>`<div class="card pop" style="animation-delay:${i*50}ms">
        <h3>${i+1} · ${q[0]}</h3>
        ${st>=i+1?`<p class="pop" style="margin-top:.28rem">${q[1]}</p>`:`<p style="opacity:.35">…</p>`}</div>`).join('')}
    </div>`; } },

{ id:'scanprob', kick:'150M rows read to return 3M', eyebrow:'Why partitioning exists · the need', title:'The full table scan problem',
  tag:'part 3 · partitioning', steps:[
  {note:'Sharding spread data across machines. But within a single instance a table can still hold hundreds of millions of rows — one region\'s orders table, say 150 million.'},
  {note:'A query for January 2025 examines all 150 million rows to find the two or three million that match. That is a full table scan, and it is slow no matter what hardware you throw at it.'},
  {note:'Now cut the table into one piece per month. Go straight to the January 2025 piece and ignore the other fifty-nine. A query that took thirty minutes now takes seconds.'}],
  body:(st)=>`<div class="stage-row">${sceneScan(st+1)}</div>` },

{ id:'partdef', kick:'one table, many physical segments', eyebrow:'Definition', title:'What is partitioning?',
  tag:'partitioning', steps:[
  {note:'Dividing a single large table into smaller physical segments called partitions — while the table still appears as one logical entity to the application. The application does not change its queries at all.'},
  {note:'Queries against the main table are automatically redirected by the engine to the relevant partitions. That automatic redirection is called partition pruning, and it is the whole benefit.'}],
  body:(st)=>`<div class="cards" style="gap:.7rem">
    <div class="pop" style="background:var(--navy);color:#fff;border-radius:12px;padding:.9rem 1.15rem">
      <div style="font-size:.52rem;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;
        color:var(--gold);margin-bottom:.3rem">Definition</div>
      <div style="font-size:.92rem;font-weight:700;line-height:1.35">Dividing a single large table into smaller physical
        segments called <span style="color:var(--orange)">Partitions</span> — while the table still appears as
        one logical entity to the application.</div></div>
    ${st>=1?`<p class="lede pop">Queries against the main table are automatically redirected by the engine to the
      relevant partition(s). This automatic redirection is called <b>Partition Pruning</b> — and it is the whole benefit.</p>`:''}
  </div>` },

{ id:'versus', kick:'machines versus tables', eyebrow:'The distinction students must not confuse', title:'Sharding vs. partitioning',
  tag:'partitioning', steps:[
  {note:'Sharding: many machines. Data is split across multiple independent database instances, each on its own hardware. It is a horizontal scaling technique — it solves "one box is not enough".'},
  {note:'Partitioning: one machine. A single table is split across storage segments inside one instance. It is a storage-organisation technique — it solves "this table is too big to scan".'},
  {note:'Say it plainly: sharding is about machines, partitioning is about tables. They are often used together — you shard across ten servers, and partition the big table on each one.'}],
  body:(st)=>`<div class="stage-row">${sceneVersus(st+1)}</div>
    ${st>=2?`<p class="lede pop">They are not alternatives — a large system does <b>both</b>: shard across ten servers,
      then partition the big table inside each one.</p>`:''}` },

{ id:'parttypes', kick:'range · list · hash', eyebrow:'Three types', title:'Range, List and Hash partitioning',
  tag:'partitioning', steps:[
  {note:'Range: divide by a range of values in the partition key. The most common type — time-series data, transaction logs, audit records.'},
  {note:'List: divide by a discrete list of values. Best for a column with a known finite set — region, country code, department, order status.'},
  {note:'Hash: apply a hash to the partition key and distribute by the result. Use it when no natural range or category exists and the goal is simply to reduce individual table sizes evenly.'}],
  body:(st)=>{
    const t=[['Range','Best for time-series','Divide by a range of values in the partition key. Time-series data, transaction logs, audit records.',
        "PARTITION BY RANGE (order_date);\n\nCREATE TABLE orders_2025\n  PARTITION OF orders\n  FOR VALUES FROM ('2025-01-01')\n  TO ('2026-01-01');",'var(--blue)'],
      ['List','Best for categorical values','Each partition holds rows matching one of its assigned values. Region, country, department, status.',
        "PARTITION BY LIST (region);\n\nCREATE TABLE customers_north\n  PARTITION OF customers\n  FOR VALUES IN ('North',\n    'NorthEast','NorthWest');",'var(--purple)'],
      ['Hash','Best for even distribution','No natural range or category exists — the goal is simply to reduce table sizes evenly.',
        "PARTITION BY HASH (product_id);\n\nCREATE TABLE products_p0\n  PARTITION OF products\n  FOR VALUES WITH\n  (MODULUS 4, REMAINDER 0);",'var(--green)']];
    return `<div class="cards" style="grid-template-columns:repeat(3,1fr);flex:1;align-content:center">
      ${t.map((x,i)=> st>=i ? `<div class="pop" style="animation-delay:${i*60}ms;background:var(--panel);
        border-radius:12px;overflow:hidden;box-shadow:var(--shadow-sm);border:1px solid var(--line);display:flex;flex-direction:column">
        <div style="background:${x[4]};color:#fff;padding:.42rem .7rem">
          <div style="font-size:.5rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;opacity:.85">${x[1]}</div>
          <div style="font-size:.8rem;font-weight:700">${x[0]} Partitioning</div></div>
        <div style="padding:.5rem .7rem;font-size:.56rem;line-height:1.4;color:var(--ink-2)">${x[2]}</div>
        <pre style="margin:0;padding:.5rem .7rem;background:var(--navy-deep);color:#cfe6ff;
          font-family:var(--mono);font-size:.46rem;line-height:1.55;flex:1;white-space:pre-wrap">${x[3]}</pre>
      </div>` : '').join('')}
    </div>`; } },

{ id:'pruning', kick:'the partitions it never opens', eyebrow:'Partition pruning in action', title:'The engine reads only what matches',
  tag:'partitioning', steps:[
  {note:'Here is the query. It filters on order_date — which is the partition key.'},
  {note:'The planner looks at the filter, works out that only orders_2025 can contain matching rows, and skips the others entirely. Not "reads them quickly" — never opens them.'},
  {note:'150 million rows down to two or three million. And notice the condition: this only works because we filtered on the partition key.'}],
  body:(st)=>`<div class="stage-row">${scenePruning(st)}</div>` },

{ id:'benefits', kick:'what partitioning buys', eyebrow:'What partitioning buys you', title:'Benefits of partitioning',
  tag:'partitioning', steps:[
  {note:'Query performance: filtering on the partition key scans only the relevant partition. The monthly seller report goes from five years of data to one month.'},
  {note:'Data lifecycle. This one is underrated. DROP TABLE orders_2020 completes in milliseconds — it is a metadata operation. A DELETE with a date filter locks the table and runs for hours.'},
  {note:'Smaller indexes: each partition has its own index, smaller and faster to scan than one massive index over the whole table.'}],
  body:(st)=>`<div class="cards" style="grid-template-columns:repeat(3,1fr)">
    ${st>=0?`<div class="pop d1">${card('Query performance','Scan one partition, not five years','Filtering on the partition key scans only the relevant partition — the monthly seller report drops from 150M rows to one month.','good',ico('bolt'))}</div>`:''}
    ${st>=1?`<div class="pop d2">${card('Data lifecycle','<code>DROP TABLE orders_2020</code>','A metadata operation completing in milliseconds — versus a DELETE that locks the table for hours.','good',ico('trash'))}</div>`:''}
    ${st>=2?`<div class="pop d3">${card('Smaller indexes','One index per partition','Smaller and faster to scan than a single massive index over the whole table.','good',ico('grid'))}</div>`:''}
  </div>` },

{ id:'limits', kick:'where partitioning stops helping', eyebrow:'Where partitioning stops helping', title:'Limitations of partitioning',
  tag:'partitioning', steps:[
  {note:'No pruning without the partition key. Partitioned by order_date, a query filtering on customer_id hits every partition. You get none of the benefit.'},
  {note:'Cross-partition aggregations add overhead. Total revenue for the year must scan every partition — partitioning does not help and adds a little coordination cost.'},
  {note:'And too many partitions degrade the planner. One partition per day over ten years is three thousand six hundred and fifty partitions. The planner evaluates all of them, and planning itself becomes slow.'}],
  body:(st)=>`<div class="cards" style="gap:.5rem">
    ${st>=0?`<div class="pop d1">${card('Pitfall 1','No pruning without the partition key','Partitioned by <code>order_date</code>, a query <code>WHERE customer_id = 500</code> hits every partition — no pruning at all.','warn',ico('ban'))}</div>`:''}
    ${st>=1?`<div class="pop d2">${card('Pitfall 2','Cross-partition aggregations add overhead','Queries that aggregate across all partitions — total revenue for the year — must scan every one of them.','warn',ico('sigma'))}</div>`:''}
    ${st>=2?`<div class="pop d3">${card('Pitfall 3','Too many partitions degrade the planner','One partition per day over 10 years = 3,650 partitions. The planner must evaluate all of them, and planning itself becomes slow.','warn',ico('clock'))}</div>`:''}
  </div>` },

{ id:'whenpart', kick:'partition on the column your WHERE clause already has', eyebrow:'Where you should — and should not — partition',
  title:'When to reach for partitioning', tag:'judgement', steps:[
  {note:'Partitioning is a much easier decision than sharding, because it is reversible and invisible to the application. Three signals.'},
  {note:'One: a single table dominates the database — hundreds of millions of rows, tens or hundreds of gigabytes, while everything else is small.'},
  {note:'Two: nearly every query filters on the same natural key, and in practice that key is almost always time. Orders by date, events by day, logs by hour.'},
  {note:'Three: you delete old data on a schedule. This is the underrated one — dropping a partition is instant, where a DELETE across hundreds of millions of rows can lock the table for hours.'},
  {note:'And the counter-cases: if the table is small enough for an index to handle, partitioning adds complexity for nothing. If there is no shared filter key you get zero pruning. And if your scheme would create thousands of partitions, planning itself becomes the bottleneck.'}],
  body:(st)=>`<div class="cards" style="grid-template-columns:1fr 1fr 1fr;gap:.55rem">
    ${st>=0?`<div class="pop d1">${card('Signal 1','One table dominates',
      'Hundreds of millions of rows, or tens to hundreds of GB, while the rest of the schema is small.','good',ico('db'))}</div>`:''}
    ${st>=1?`<div class="pop d2">${card('Signal 2','A shared filter key',
      'Nearly every query filters on the same column — in practice that column is almost always time.','good',ico('clock'))}</div>`:''}
    ${st>=2?`<div class="pop d3">${card('Signal 3','Scheduled deletion',
      'You drop old data on a cadence. <code>DROP TABLE</code> on a partition is instant; a DELETE is hours.','good',ico('trash'))}</div>`:''}
    ${st>=3?`<div style="grid-column:1/-1" class="pop">${card('Do not partition when','It buys you nothing',
      'The table is small enough for an index to handle · there is no shared filter key, so nothing prunes · or the scheme would create thousands of partitions and slow the planner down.','warn',ico('ban'))}</div>`:''}
  </div>` },

{ id:'quiz3', kick:'check your understanding', eyebrow:'Check yourself', title:'Partitioning checkpoint',
  tag:'checkpoint', steps:[
  {note:'Three questions again — this is the one they will be examined on.'},
  {note:'Sharding splits data across multiple independent database instances on different machines — that is scaling. Partitioning splits one table into segments within a single instance — that is storage organisation.'},
  {note:'No. The filter is not on the partition key, so the engine cannot prune and must scan every partition.'},
  {note:'Dropping a partition is a metadata operation completing in milliseconds. A DELETE with a date filter locks the table and runs for hours across hundreds of millions of rows.'}],
  body:(st)=>{
    const qs=[['Difference between sharding and partitioning, in two sentences?',
        'Sharding splits data across multiple independent database instances on different machines (scaling). Partitioning splits one table into segments within a single instance (storage organisation).'],
      ['Partitioned by <code>order_date</code> — does <code>WHERE customer_id = 500</code> prune?',
        'No. The filter is not on the partition key, so the engine cannot prune and must scan every partition.'],
      ['Why drop a partition to remove old data instead of a DELETE?',
        'Dropping a partition is a metadata operation completing in milliseconds. A DELETE with a date filter locks the table and runs for hours across hundreds of millions of rows.']];
    return `<div class="cards" style="gap:.5rem">
      ${qs.map((q,i)=>`<div class="card pp pop" style="animation-delay:${i*50}ms">
        <h3>${i+1} · ${q[0]}</h3>
        ${st>=i+1?`<p class="pop" style="margin-top:.28rem">${q[1]}</p>`:`<p style="opacity:.35">…</p>`}</div>`).join('')}
    </div>`; } },

{ id:'amazondb', kick:'the paper that started it', eyebrow:'Amazon\'s own answer',
  title:'Dynamo, and the partition key', tag:'real world', steps:[
  {note:'Before we look at anyone else, look at what Amazon itself published. The 2007 Dynamo paper describes partitioning a key space across a ring of nodes using consistent hashing, so that adding or removing a node moves only a fraction of the keys instead of re-hashing everything.'},
  {note:'That paper is the direct ancestor of DynamoDB, and of a whole generation of distributed stores that followed it.'},
  {note:'And DynamoDB makes today\'s lesson unavoidable. Every table must declare a partition key. DynamoDB hashes that key to choose a physical partition — which is exactly hash-based sharding, offered as a managed service.'},
  {note:'Here is the payoff line for the whole lecture: choosing a low-cardinality partition key in DynamoDB gives you a hot partition. That is the same hotspot we drew on the bar chart. Managed infrastructure does not remove the shard-key decision — it just stops you from being able to fix it afterwards.'}],
  body:(st)=>`<div class="cards plan" style="gap:.45rem">
    ${st>=0?`<div class="pop d1">${card('Dynamo · 2007','Consistent hashing across a ring',
      'Partition the key space across a ring of nodes so that adding or removing a node moves only a fraction of the keys — not all of them.','',ico('layers'))}</div>`:''}
    ${st>=1?`<div class="pop d2">${card('Its descendants','DynamoDB, and much of the industry',
      'The paper is the direct ancestor of DynamoDB and of a generation of distributed stores built after it.','tl',ico('route'))}</div>`:''}
    ${st>=2?`<div class="pop d3">${card('DynamoDB today','Every table declares a partition key',
      'The key is hashed to choose a physical partition. That is hash-based sharding, offered as a managed service.','tl',ico('db'))}</div>`:''}
    ${st>=3?`<div class="pop d4">${card('The lesson','A low-cardinality key still burns you',
      'Pick a poor partition key and you get a hot partition — the same hotspot from the bar chart. Managed infrastructure does not remove the shard-key decision.','warn',ico('ban'))}</div>`:''}
  </div>` },

{ id:'wild', kick:'every one of them shards on the tenant', eyebrow:'How other production systems do this',
  title:'In the wild', tag:'real world', steps:[
  {note:'Publicly documented architectures — engineering blogs, conference talks, open source.'},
  {note:'Instagram sharded PostgreSQL by user ID, into thousands of logical shards mapped onto a smaller number of physical databases. The logical-shard trick means a shard can move between machines without re-hashing.'},
  {note:'Notion sharded Postgres by workspace ID. A workspace is the natural unit — almost every query in the product is already scoped to one workspace, so almost every query hits one shard.'},
  {note:'Shopify calls theirs pods: a shop lives entirely inside one shard, with its own database and application capacity. Same idea — shard on the tenant.'},
  {note:'Vitess began as YouTube\'s sharding layer over MySQL and is now open source, used by companies who want sharding without writing the router themselves.'},
  {note:'And on the partitioning side, TimescaleDB is essentially automated Postgres range partitioning by time — chunks instead of partitions, created and pruned for you.'},
  {note:'Pull the common thread out loud: every one of these shards on the entity the product is about. Amazon on the item or customer key, Notion on the workspace, Shopify on the shop. That is what keeps queries on a single shard.'}],
  body:(st)=>{
    const rows=[
      ['Instagram','PostgreSQL, sharded by user ID','Thousands of logical shards mapped onto fewer physical databases — so a shard can move machines without re-hashing.','users',''],
      ['Notion','PostgreSQL, sharded by workspace ID','A workspace is the natural unit: nearly every query in the product is already scoped to one.','layers','tl'],
      ['Shopify','MySQL "pods", sharded by shop','A shop lives entirely inside one shard, with its own database and application capacity.','build','tl'],
      ['Vitess (from YouTube)','A sharding layer over MySQL','Began as YouTube\'s router, now open source — sharding without writing the router yourself.','route','pp'],
      ['TimescaleDB','PostgreSQL range partitioning by time','Chunks instead of partitions, created and dropped automatically. Partitioning as a product.','clock','pp']];
    return `<div class="cards" style="gap:.38rem">
      ${rows.map((r,i)=> st>=i+1 ? `<div class="card ${r[4]} pop" style="animation-delay:${i*40}ms;padding:.42rem .95rem">
        <span class="ico" style="top:.5rem;width:1.85rem;height:1.85rem">${ico(r[3])}</span>
        <div style="display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;padding-right:2.4rem">
          <span style="font-size:.86rem;font-weight:700">${r[0]}</span>
          <span style="font-family:var(--mono);font-size:.6rem;color:var(--blue)">${r[1]}</span></div>
        <p style="margin-top:.08rem;font-size:.68rem;line-height:1.4;padding-right:2.4rem">${r[2]}</p></div>` : '').join('')}
      ${st>=6?`<div class="pop" style="margin-top:.04rem;padding:.44rem .95rem;border-radius:10px;
        background:var(--accent-tint);border:1px solid var(--accent-soft);border-left:5px solid var(--blue)">
        <p style="margin:0;font-size:.72rem;line-height:1.4;color:var(--ink)">
        <b>The common thread:</b> every one of them shards on the entity the product is about — customer, workspace,
        shop — so the overwhelming majority of queries stay on a single shard.</p></div>`:''}
    </div>`; } },

{ id:'ladder', kick:'sharding is the last rung, not the first', eyebrow:'Before you re-architect anything',
  title:'The escalation ladder', tag:'judgement', steps:[
  {note:'This slide is the one I most want them to remember. Most engineers who say "we need to shard" actually have a missing index. Work up the ladder, never start at the top.'},
  {note:'Rung one: read the execution plan, rewrite the query, add the right index. Hours of work, completely reversible, and it fixes the majority of real slowdowns.'},
  {note:'Rung two: fix the schema. Wrong data types, missing foreign keys, a column that should have been a separate table. Days of work, still reversible.'},
  {note:'Rung three: cache what is hot. If the same twenty queries are ninety percent of your traffic, the fastest query is the one you never send.'},
  {note:'Rung four: read replicas. If READS are the bottleneck — reports, dashboards, search — replicas are dramatically cheaper and simpler than sharding. This is the step people skip.'},
  {note:'Rung five: partition. Now you are changing storage layout, but still on one machine, and the application does not change.'},
  {note:'Rung six: shard. Months of work, and it is a permanent architectural commitment — you do not casually un-shard a system. Earn your way here.'}],
  body:(st)=>{
    const rungs=[
      ['1','Tune the query','Read the plan. Rewrite it. Add the index it is missing.','hours · reversible','search',''],
      ['2','Fix the schema','Right types, right keys, right tables.','days · reversible','grid',''],
      ['3','Cache what is hot','The fastest query is the one you never send.','days · reversible','bolt','tl'],
      ['4','Add read replicas','If READS are the bottleneck, this is far cheaper than sharding.','days · reversible','layers','tl'],
      ['5','Partition the table','Storage layout changes. One machine. No application change.','weeks · reversible','db','pp'],
      ['6','Shard','Months of work, and a permanent architectural commitment.','months · one-way door','server','warn']];
    return `<div class="cards" style="gap:.4rem">
      ${rungs.map((r,i)=> st>=i ? `<div class="card ${r[5]} pop" style="animation-delay:${i*40}ms;padding:.6rem .95rem">
        <span class="ico">${ico(r[4])}</span>
        <div style="display:flex;align-items:baseline;gap:.6rem">
          <span style="font-family:var(--serif);font-size:.86rem;font-weight:600;color:var(--accent-deep)">${r[0]}</span>
          <span style="font-family:var(--serif);font-size:.86rem;font-weight:600">${r[1]}</span>
          <span style="font-family:var(--mono);font-size:.58rem;color:var(--muted);margin-left:auto;
            padding-right:2.6rem;white-space:nowrap">${r[3]}</span></div>
        <p style="margin-top:.1rem;font-size:.7rem">${r[2]}</p></div>` : '').join('')}
    </div>`; } },

{ id:'plan', kick:'the ladder, applied', eyebrow:'What we would actually do',
  title:'Putting it together', tag:'real world', steps:[
  {note:'Let us end by applying the ladder to the company we opened with, in order.'},
  {note:'Step one: partition orders by month. The monthly report stops scanning five years of data, and retention becomes a DROP instead of an overnight DELETE. Weeks of work, no application change, fully reversible.'},
  {note:'Step two: move the reporting and analytics traffic to read replicas. Those queries are the ones hurting everyone else, and they do not need the primary.'},
  {note:'Step three, and only if writes are still the wall after one and two: shard by customer_id. Note the choice — customer_id, not order_date. And we co-locate each customer\'s orders with the customer row, so the join the product runs constantly stays inside one shard.'},
  {note:'And explicitly, what we would not do: shard by order_date, which recreates the hotspot we saw; or shard before partitioning, which is months of irreversible work to solve a problem that weeks of reversible work would have solved.'}],
  body:(st)=>`<div class="cards plan" style="gap:.42rem">
    ${st>=1?`<div class="pop d1">${card('Step 1 · weeks, reversible','Partition <code>orders</code> by month',
      'The monthly report stops scanning five years. Retention becomes <code>DROP TABLE orders_2020</code> instead of an overnight DELETE. No application change.','good',ico('db'))}</div>`:''}
    ${st>=2?`<div class="pop d2">${card('Step 2 · days, reversible','Move reporting to read replicas',
      'Analytics queries are what hurt everyone else, and they do not need the primary.','good',ico('layers'))}</div>`:''}
    ${st>=3?`<div class="pop d3">${card('Step 3 · only if writes are still the wall','Shard by <code>customer_id</code>',
      'Co-locate each customer\'s orders with the customer row, so the join the product runs constantly stays inside one shard.','tl',ico('server'))}</div>`:''}
    ${st>=4?`<div class="pop d4">${card('What we would not do','Shard first, or shard by date',
      'Sharding by <code>order_date</code> recreates the hotspot. Sharding before partitioning spends months of irreversible work on a problem weeks of reversible work would have solved.','warn',ico('ban'))}</div>`:''}
  </div>` },

{ id:'recap', kick:'the foundation and the floor plan are done', eyebrow:'Where we\'ve been · what\'s next', title:'Two levels down, three to go',
  tag:'recap', steps:[
  {note:'Level one, System: sharding. Scale out across machines. Range, hash and directory strategies — mind the shard key, the hotspots, and the cross-shard cost.'},

        how does the database stop two updates to the same row from corrupting each other?</div></div>`:''}` }
];
</script>
<script>
/* ---- assemble the running order: a chapter opener, then that chapter's slides ---- */
const BY_ID = Object.fromEntries(DECK.map(d => [d.id, d]));
const RUN = [];
CHAPTERS.forEach(ch => {
  if(OPENERS[ch.n]) RUN.push({
    id:'ch'+ch.n, chapter:ch, type:'chapter',
    eyebrow:'Chapter '+ch.n, title:ch.t, kick:OPENERS[ch.n].when, tag:'story',
    steps:[
      {note:'Chapter card. Pause here — this is where the story turns. Read the situation, then let them feel the problem before you name the technique.'},
      {note:OPENERS[ch.n].problem},
      {note:OPENERS[ch.n].detail},
      {note:OPENERS[ch.n].next}
    ],
    body:(st)=>chapterBody(ch, st)
  });
  ch.of.forEach(id => { const d = BY_ID[id]; if(d){ d.chapter = ch; RUN.push(d); } });
});
DECK.length = 0;
RUN.forEach(d => DECK.push(d));

/* ===================== presenter engine ===================== */
const $ = s => document.querySelector(s);
const stage = $('#stage');
let si = 0, pi = 0, lastSlide = null;

function render(){
  const sl = DECK[si];
  pi = Math.max(0, Math.min(pi, sl.steps.length - 1));
  const entering = lastSlide !== sl.id;
  lastSlide = sl.id;
  stage.innerHTML = `<div class="slide"${entering?' data-entering="1"':''}>`
                  + `<div class="fit">${sl.body(pi)}</div></div>`;
  $('#sTitle').textContent   = sl.title;
  $('#sEyebrow').textContent = sl.eyebrow;
  $('#sKick').textContent    = sl.kick || '';
  railState(sl);
  $('#stepCount').textContent = `${si+1}/${DECK.length} · step ${pi+1}/${sl.steps.length}`;
  $('#noteSay').innerHTML = sl.steps[pi].note || '—';
  $('#noteNxt').textContent = pi+1 < sl.steps.length
    ? `next → step ${pi+2} of this slide`
    : (si+1 < DECK.length ? `next → ${DECK[si+1].title}` : 'end of deck');
  const done = DECK.slice(0, si).reduce((n,d)=>n+d.steps.length, 0) + pi + 1;
  const all  = DECK.reduce((n,d)=>n+d.steps.length, 0);
  $('#progFill').style.width = (done/all*100).toFixed(2) + '%';
  fitSlide();
}

/* Scale the current step down if it would not fit, so a slide is never
   scrollable and never clipped. Entrance animations start elements translated,
   so the first measurement can read short — re-measure once the frame has laid
   out and again once the longest entrance has finished. */
let fitTimer = null;
function fitSlide(){
  const slide = stage.querySelector('.slide'), fit = stage.querySelector('.fit');
  if(!slide || !fit) return;
  const measure = () => {
    if(!fit.isConnected) return;
    fit.style.transform = '';
    /* A centred flex column splits its overflow above AND below, and
       scrollHeight only counts what hangs below — so it under-reports the true
       need by about half. Measure top-aligned, where all of it goes downward. */
    fit.style.justifyContent = 'flex-start';
    const avail = fit.clientHeight, need = fit.scrollHeight;
    fit.style.justifyContent = '';
    if(need > avail + 1){
      const k = Math.max(0.6, (avail - 6) / need);       // 6px of breathing room
      fit.style.transform = `scale(${k.toFixed(4)})`;
    }
  };
  measure();
  requestAnimationFrame(measure);
  clearTimeout(fitTimer);
  fitTimer = setTimeout(measure, 520);                  // after the last .pop lands
}
window.addEventListener('resize', fitSlide);
if(window.ResizeObserver) new ResizeObserver(fitSlide).observe(document.querySelector('#app'));
/* the rail is the table of contents: click a chapter to jump to its first slide */
$('#railNav').innerHTML = CHAPTERS.map(ch =>
  `<div class="rn" data-ch="${ch.n}">
     <span class="rn-n">${String(ch.n).padStart(2,'0')}</span>
     <span class="rn-t">${ch.t}</span></div>`).join('');
$('#railNav').querySelectorAll('.rn').forEach(el => el.onclick = () => {
  const n = +el.dataset.ch;
  const at = DECK.findIndex(d => d.chapter && d.chapter.n === n);
  if(at >= 0){ si = at; pi = 0; render(); }
});
function railState(sl){
  const cur = sl.chapter ? sl.chapter.n : 0;
  $('#railNav').querySelectorAll('.rn').forEach(el => {
    const n = +el.dataset.ch;
    el.classList.toggle('now',  n === cur);
    el.classList.toggle('done', n <  cur);
  });
}

/* ---- navigation: right / left arrow drive the whole deck ---- */
function next(){
  const s = DECK[si];
  if(pi < s.steps.length-1) pi++;
  else if(si < DECK.length-1){ si++; pi = 0; }
  else return;
  render();
}
function prev(){
  if(pi > 0) pi--;
  else if(si > 0){ si--; pi = DECK[si].steps.length-1; }
  else return;
  render();
}
function jump(d){ const n = si+d; if(n<0||n>=DECK.length) return; si=n; pi=0; render(); }

/* ---- presenter zoom: type is a share of screen height, this multiplies it ---- */
const ZMIN=.6, ZMAX=2.0, ZSTEP=.08;
let zoom = 1;
try { zoom = parseFloat(localStorage.getItem('dbopt-zoom')) || 1; } catch(e){}
function applyZoom(show){
  zoom = Math.min(ZMAX, Math.max(ZMIN, zoom));
  document.documentElement.style.setProperty('--scale', zoom.toFixed(3));
  try { localStorage.setItem('dbopt-zoom', zoom); } catch(e){}
  if(show){
    const px = parseFloat(getComputedStyle(document.documentElement).fontSize);
    const z = $('#zoom');
    z.innerHTML = Math.round(zoom*100) + '%<small>body text &asymp; ' + Math.round(px*.72) + 'px · 0 resets</small>';
    z.classList.add('show');
    clearTimeout(z._t); z._t = setTimeout(()=>z.classList.remove('show'), 1100);
  }
  fitSlide();
}
applyZoom(false);

/* ---- theme: light matches the lecture deck, dark reads better in a dim hall ---- */
function applyTheme(t, show){
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('dbopt-theme', t); } catch(e){}
  if(show){
    const z = $('#zoom');
    z.innerHTML = (t === 'dark' ? 'Dark' : 'Light') + '<small>press T to switch</small>';
    z.classList.add('show');
    clearTimeout(z._t); z._t = setTimeout(()=>z.classList.remove('show'), 900);
  }
}
let theme = 'light';
try { theme = localStorage.getItem('dbopt-theme') || 'light'; } catch(e){}
applyTheme(theme, false);

document.addEventListener('keydown', e=>{
  if($('#ov').classList.contains('open') && !['o','O','Escape'].includes(e.key)) return;
  switch(e.key){
    case 'ArrowRight': case ' ': case 'PageDown': e.preventDefault(); next(); break;
    case 'ArrowLeft':  case 'PageUp':            e.preventDefault(); prev(); break;
    case 'ArrowDown':  e.preventDefault(); jump(1);  break;
    case 'ArrowUp':    e.preventDefault(); jump(-1); break;
    case 'Home': si=0; pi=0; render(); break;
    case 'End':  si=DECK.length-1; pi=DECK[si].steps.length-1; render(); break;
    case 'f': case 'F': e.preventDefault(); toggleFull(); break;
    case 's': case 'S': $('#notes').classList.toggle('open'); break;
    case 'o': case 'O': $('#ov').classList.toggle('open'); break;
    case 't': case 'T':
      theme = theme === 'dark' ? 'light' : 'dark'; applyTheme(theme, true); break;
    case 'r': case 'R': pi = 0; render(); break;
    case 'Escape': $('#ov').classList.remove('open'); $('#notes').classList.remove('open'); break;
    case '+': case '=': e.preventDefault(); zoom += ZSTEP; applyZoom(true); break;
    case '-': case '_': e.preventDefault(); zoom -= ZSTEP; applyZoom(true); break;
    case '0': e.preventDefault(); zoom = 1; applyZoom(true); break;
  }
});
stage.addEventListener('click', () => next());

/* ---- full screen: a visible control, since F is only in the footer legend ---- */
function toggleFull(){
  document.fullscreenElement ? document.exitFullscreen()
                             : document.documentElement.requestFullscreen().catch(()=>{});
}
$('#btnFull').addEventListener('click', e => { e.stopPropagation(); toggleFull(); });
document.addEventListener('fullscreenchange', () => {
  $('#btnFullTxt').textContent = document.fullscreenElement ? 'Exit' : 'Present';
});

/* ---- run of show ---- */
$('#ovGrid').innerHTML = DECK.map((s,i)=>
  `<div class="ovc${s.type==='chapter'?' ovc-ch':''}" data-i="${i}">
     <div class="i">${s.chapter ? 'CH '+s.chapter.n : ''} · ${s.tag}</div>
     <div class="t">${s.title}</div></div>`).join('');
$('#ovGrid').querySelectorAll('.ovc').forEach(el =>
  el.onclick = () => { si=+el.dataset.i; pi=0; $('#ov').classList.remove('open'); render(); });

/* ---- elapsed timer ---- */
const t0 = Date.now();
setInterval(()=>{
  const s = Math.floor((Date.now()-t0)/1000);
  $('#clock').textContent = String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}, 1000);

render();
</script>
</body>
</html>
