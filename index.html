<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Database Optimization</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Type is a share of SCREEN HEIGHT so the deck keeps its physical size on any
     projector resolution. --scale is the presenter's live zoom (+ / - / 0).   */
  --scale:1;

  /* Amazon palette.
     Orange is a FILL colour only — #FF9900 on white is ~2.2:1 and fails as text.
     Small text uses squid ink or the teal link colour instead.               */
  --squid:#232F3E;          /* Amazon nav / masthead */
  --squid-2:#37475A;        /* secondary nav */
  --squid-deep:#131A22;
  --orange:#FF9900;         /* Amazon orange */
  --orange-deep:#E47911;
  --orange-soft:#FFF3E0;
  --link:#007185;           /* Amazon teal link */
  --link-soft:#E3F1F3;
  --ink:#0F1111;
  --ink-2:#3A4145;
  --muted:#565959;
  --paper:#EAEDED;          /* Amazon page background */
  --white:#FFFFFF;
  --line:#D5D9D9;
  --line-2:#E3E6E6;
  --red:#B12704;            /* Amazon price red */
  --red-soft:#FDECEA;
  --green:#067D62;          /* Amazon success green */
  --green-soft:#E7F4F1;

  --bg:var(--paper);
  --bg-2:#DFE3E3;
  --panel:var(--white);
  --panel-2:#F3F5F5;

  /* names the rest of the stylesheet and the scene code already speak */
  --navy:var(--squid);
  --navy-deep:var(--squid-deep);
  --blue:var(--link);
  --cyan:var(--squid-2);
  --gold:var(--orange);
  --gold-soft:var(--orange-soft);
  --accent:var(--link);
  --accent-deep:var(--squid);
  --accent-soft:#C7D1D1;
  --accent-tint:var(--link-soft);
  --violet:var(--squid-2);
  --violet-soft:#E7EAEE;
  --teal:var(--link);
  --clay:var(--red);
  --ok:var(--green);
  --navy-900:var(--ink);
  --navy-800:var(--squid-deep);
  --navy-700:var(--squid);
  --blue-400:var(--squid);
  --blue-300:var(--orange);
  --purple:var(--squid-2);
  --purple-300:var(--orange);

  --shadow:0 14px 34px rgba(15,17,17,.14);
  --shadow-sm:0 6px 18px rgba(15,17,17,.10);

  --arial:Arial,'Helvetica Neue',Helvetica,sans-serif;
  --serif:var(--arial);
  --news:var(--arial);
  --sans:var(--arial);
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
:root[data-theme="dark"]{
  --bg:#131A22;
  --bg-2:#1A222C;
  --panel:#232F3E;
  --panel-2:#2C3A4B;
  --ink:#F2F4F4;
  --ink-2:#CDD4D8;
  --muted:#9BA4A8;
  --line:#3B4A5C;
  --line-2:#33404F;
  --white:#232F3E;
  --squid:#131A22;
  --link:#4FBFC9;
  --accent-soft:#3B4A5C;
  --accent-tint:#1D2C34;
  --link-soft:#1D2C34;
  --violet-soft:#2C3A4B;
  --red-soft:#3A1C16;
  --green-soft:#0F2E28;
  --shadow:0 14px 34px rgba(0,0,0,.5);
  --shadow-sm:0 6px 18px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{height:100dvh}
html{font-size:clamp(15px, calc(3.5vh * var(--scale)), 56px)}
body{
  margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:var(--sans);overflow:hidden;
}

/* ================= shell: chapter rail + document =================
   Flat and rule-based rather than floating cards: square corners, hairline
   borders, no shadows. The rail carries identity and position so the stage
   gets the full height of the screen.                                      */
#app{height:100%;max-width:100%;display:grid;
  grid-template-columns:clamp(8.2rem,12.5vw,12.5rem) minmax(0,1fr);
  grid-template-rows:minmax(0,1fr);overflow:hidden}

.rail{background:var(--squid);color:#fff;display:flex;flex-direction:column;
  padding:.9rem .9rem;gap:.7rem;border-right:3px solid var(--orange);
  min-width:0;min-height:0;overflow:hidden}
.rail-lecture{font-size:.46rem;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;
  color:var(--orange);padding-bottom:.8rem;border-bottom:1px solid rgba(255,255,255,.18)}
.rail-lecture b{display:block;margin-top:.3rem;font-size:.76rem;letter-spacing:-.01em;
  text-transform:none;color:#fff;line-height:1.18}

.rail-nav{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;
  gap:.08rem;overflow:hidden}
.rn{display:grid;grid-template-columns:1.35rem 1fr;gap:.4rem;align-items:baseline;
  padding:.3rem .25rem;cursor:pointer;border-left:3px solid transparent;
  color:rgba(255,255,255,.78);transition:color .15s,border-color .15s,background .15s}
.rn:hover{color:#fff;background:rgba(255,255,255,.06)}
.rn-n{font-family:var(--mono);font-size:.46rem;font-weight:700;text-align:right}
.rn-t{font-size:.5rem;font-weight:600;line-height:1.25}
.rn.done{color:rgba(255,255,255,.68)}
.rn.now{color:#fff;border-left-color:var(--orange);background:rgba(255,153,0,.14)}
.rn.now .rn-n{color:var(--orange)}

.rail-foot{flex:0 0 auto;display:flex;flex-direction:column;gap:.5rem;
  padding-top:.7rem;border-top:1px solid rgba(255,255,255,.18)}
.present{display:inline-flex;align-items:center;justify-content:center;gap:.4em;cursor:pointer;
  font-family:var(--arial);font-size:.5rem;font-weight:700;letter-spacing:.5px;
  padding:.4rem .6rem;border:none;background:var(--orange);color:var(--squid-deep);
  transition:filter .15s}
.present:hover{filter:brightness(1.08)}
.present svg{width:1.05em;height:1.05em}
.rail-meta{display:flex;justify-content:space-between;gap:.4rem;font-family:var(--mono);
  font-size:.44rem;color:rgba(255,255,255,.62)}
.rail-keys{font-size:.4rem;line-height:1.7;color:rgba(255,255,255,.45)}
kbd{font-family:var(--mono);font-size:.92em;background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.2);border-radius:2px;padding:1px 4px;color:#fff}

.doc{min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}
.doc-head{flex:0 0 auto;min-width:0;padding:.72rem 1.35rem .5rem;border-bottom:3px solid var(--squid)}
.eyebrow{font-size:.56rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:var(--link);margin-bottom:.2rem}
.slide-title{margin:0;font-size:1.42rem;font-weight:700;line-height:1.1;letter-spacing:-.02em;
  color:var(--squid)}
:root[data-theme="dark"] .slide-title{color:var(--ink)}
.kick{margin-top:.18rem;font-style:italic;font-size:.62rem;color:var(--muted)}

main{flex:1 1 auto;min-height:0;min-width:0;padding:.65rem 1.35rem .7rem;display:flex;overflow:hidden}
.slide{flex:1 1 auto;min-height:0;min-width:0;display:flex;align-items:center;
  justify-content:center;overflow:hidden}
.fit{width:100%;height:100%;min-height:0;display:flex;flex-direction:column;gap:.38rem;
  justify-content:center;transform-origin:center center}

.progress{flex:0 0 auto;height:4px;background:var(--line)}
.progress span{display:block;height:100%;background:var(--orange);transition:width .2s ease}

@media (max-height:820px){ .rail-keys{display:none} }
@media (max-height:720px){
  .rail-lecture{padding-bottom:.5rem}
  .rail-lecture b{font-size:.56rem}
  .rn{padding:.22rem .25rem}
  .rail-foot{gap:.35rem;padding-top:.5rem}
}
@media (max-height:600px){
  .rail-lecture b{display:none}
  .rn-t{font-size:.46rem}
}

@media (max-width:860px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .rail{flex-direction:row;align-items:center;gap:.7rem;border-right:none;
    border-bottom:3px solid var(--orange);padding:.5rem .8rem}
  .rail-nav,.rail-keys{display:none}
  .rail-lecture{padding-bottom:0;border-bottom:none}
  .rail-foot{flex-direction:row;align-items:center;border-top:none;padding-top:0;margin-left:auto}
  .doc-head{padding:.8rem 1rem .5rem}
  main{padding:.7rem 1rem}
}

/* ================= shared blocks ================= */
.lede{margin:0;font-family:var(--news);font-size:.86rem;line-height:1.5;color:var(--ink-2);max-width:54rem}
.lede b{color:var(--ink);font-weight:600}
.kicker{font-family:var(--news);font-style:italic;font-size:.82rem;color:var(--violet);margin:0}
.stage-row{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
svg.scene{width:100%;height:100%;max-height:100%;overflow:visible;fill:var(--ink)}
.cards{display:grid;gap:.5rem}
/* equal-height cards within a row, without forcing the grid to fill */
.fit > .cards > .pop{display:flex}
.fit > .cards > .pop > .card{flex:1 1 auto}
.card{position:relative;background:var(--panel);border:1px solid var(--line);
  border-top:3px solid var(--blue);border-radius:0;padding:.6rem .85rem;overflow:hidden}
.card.warn{border-top-color:var(--red)} .card.good{border-top-color:var(--green)}
.card.pp{border-top-color:var(--squid-2)} .card.tl{border-top-color:var(--link)}
.card h4{margin:0 0 .22rem;font-size:.56rem;font-weight:700;letter-spacing:1.9px;
  text-transform:uppercase;color:var(--blue)}
.card.warn h4{color:var(--red)} .card.good h4{color:var(--green)}
.card.pp h4{color:var(--squid-2)} .card.tl h4{color:var(--link)}
.card h3{margin:0 0 .22rem;font-size:.85rem;font-weight:700;line-height:1.22;letter-spacing:-.01em;
  color:var(--ink)}
.card p{margin:0;font-size:.68rem;line-height:1.42;color:var(--ink-2)}
.card:has(.ico) h3,.card:has(.ico) h4{padding-right:2.6rem}
.card .ico{position:absolute;right:.7rem;top:.7rem;width:1.8rem;height:1.8rem;border-radius:0;
  display:grid;place-items:center;background:transparent;border:1px solid var(--line)}
.card .ico svg{width:1rem;height:1rem;color:var(--blue)}
.card.warn .ico svg{color:var(--red)} .card.good .ico svg{color:var(--green)}
.card.pp .ico svg{color:var(--squid-2)} .card.tl .ico svg{color:var(--link)}
code,.mono{font-family:var(--mono);font-size:.88em;background:var(--accent-tint);
  padding:1px 5px;border-radius:0;color:var(--squid);border:1px solid var(--accent-soft)}
:root[data-theme="dark"] code,:root[data-theme="dark"] .mono{color:var(--orange)}

.pop{opacity:0;transform:translateY(12px);animation:pop .42s cubic-bezier(.22,1,.36,1) forwards}
@keyframes pop{to{opacity:1;transform:none}}
.d1{animation-delay:.06s}.d2{animation-delay:.14s}.d3{animation-delay:.22s}
.d4{animation-delay:.3s}.d5{animation-delay:.38s}.d6{animation-delay:.46s}

/* ================= motion primitives ================= */
@keyframes drawIn{to{stroke-dashoffset:0}}
@keyframes fadeIn{to{opacity:1}}
@keyframes riseIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
@keyframes glowPulse{0%,100%{filter:drop-shadow(0 0 0 rgba(27,127,212,0))}
                     50%{filter:drop-shadow(0 0 10px rgba(27,127,212,.65))}}
@keyframes hotPulse{0%,100%{filter:drop-shadow(0 0 2px rgba(232,85,45,.35))}
                    50%{filter:drop-shadow(0 0 16px rgba(232,85,45,.85))}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes spinSlow{to{transform:rotate(360deg)}}
@keyframes dashFlow{to{stroke-dashoffset:-36}}

.sv-draw{stroke-dasharray:var(--len,600);stroke-dashoffset:var(--len,600);
  animation:drawIn .7s ease forwards}
.sv-fade{opacity:0;animation:fadeIn .45s ease forwards}
.sv-rise{opacity:0;animation:riseIn .5s cubic-bezier(.22,1,.36,1) forwards}
.sv-pop{opacity:0;transform-box:fill-box;transform-origin:center;
  animation:popIn .45s cubic-bezier(.34,1.56,.64,1) forwards}
.sv-glow{animation:glowPulse 2.1s ease-in-out infinite}
.sv-hot{animation:hotPulse 1.3s ease-in-out infinite}
.sv-float{animation:floatY 2.6s ease-in-out infinite}
.wire{stroke:var(--line);stroke-width:2;fill:none}
.wire.live{stroke:var(--blue);stroke-width:2.5;stroke-dasharray:9 9;animation:dashFlow .9s linear infinite}
/* `animation` is a shorthand, so a flowing wire that also fades in needs BOTH
   animations declared together — otherwise the flow replaces the fade and the
   line is stuck at opacity 0. */
/* packets riding the wires */
.packet{filter:drop-shadow(0 0 4px currentColor);opacity:.95}
@keyframes growUp{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.sv-grow{transform-box:fill-box;transform-origin:bottom;animation:growUp .75s cubic-bezier(.22,1,.36,1) forwards}
@keyframes sweepX{0%{transform:translateX(0)}100%{transform:translateX(var(--sweep,840px))}}
.sv-sweep{animation:sweepX 2.4s linear infinite}
@keyframes blip{0%,100%{opacity:.25}50%{opacity:1}}
.sv-blip{animation:blip 1.4s ease-in-out infinite}
@keyframes railPulse{0%,100%{opacity:1}50%{opacity:.55}}
.rn.now .rn-n{animation:railPulse 2.4s ease-in-out infinite}
.wire.live.sv-fade{animation:dashFlow .9s linear infinite, fadeIn .45s ease forwards}
.wire.sv-fade{animation:fadeIn .45s ease forwards}
.wire.hotwire{stroke:var(--orange)}
text{font-family:var(--arial)}
.t-lbl{font-size:15px;font-weight:600;fill:var(--ink)}
.t-serif{font-family:var(--serif);font-weight:700;fill:var(--ink)}
.t-sub{font-size:15px;fill:var(--muted)}
.t-mono{font-family:'JetBrains Mono',monospace;font-size:14px;fill:var(--ink-2)}
.t-big{font-family:var(--serif);font-size:24px;font-weight:700;fill:var(--ink)}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
.box-navy{fill:var(--navy-700);stroke:none}
.box-blue{fill:var(--blue);stroke:none}
.box-purple{fill:var(--purple);stroke:none}
.box-orange{fill:var(--orange);stroke:none}
.on-navy{fill:#fff}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
  .sv-draw{stroke-dashoffset:0}
  .sv-fade,.sv-rise,.sv-pop,.pop{opacity:1;transform:none}
}

/* ================= side-by-side explainer ================= */
.split{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);
  gap:.9rem;align-items:center}
.split-l,.split-r{min-width:0;min-height:0}
.split-l{display:flex;align-items:center}
.lp{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--blue);
  border-radius:0;padding:.85rem 1rem}
.lp-head{display:flex;align-items:center;flex-wrap:wrap;gap:.45rem;margin-bottom:.45rem;min-width:0}
.lp-ico{flex:0 0 auto;width:2rem;height:2rem;border-radius:0;display:grid;place-items:center;
  background:transparent;border:1px solid var(--line)}
.lp-ico svg{width:1.1rem;height:1.1rem;color:var(--blue)}
.lp-n{font-size:.56rem;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--blue)}
.lp-t{font-size:.8rem;font-weight:700;line-height:1.15;color:var(--ink)}
.lp-when{margin-left:auto;flex:0 0 auto;white-space:nowrap;font-size:.5rem;font-weight:700;letter-spacing:1.4px;
  text-transform:uppercase;color:var(--squid-deep);background:var(--orange);padding:3px 8px}
.lp-owns{margin:0 0 .5rem;font-size:.68rem;line-height:1.45;color:var(--ink-2)}
.lp-row{display:grid;grid-template-columns:4.1rem minmax(0,1fr);gap:.5rem;padding:.28rem 0;
  border-top:1px solid var(--line-2)}
.lp-k{font-size:.55rem;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);
  padding-top:.12rem}
.lp-row.warn .lp-k{color:var(--red)} .lp-row.good .lp-k{color:var(--green)}
.lp-v{font-size:.64rem;line-height:1.4;color:var(--ink-2)}
@media (max-width:980px){.split{grid-template-columns:1fr;gap:.6rem}}

/* ================= chapter opener ================= */
.chapter{flex:1 1 auto;display:flex;align-items:center;gap:2.4rem;padding:0 .6rem}
.ch-rail{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:.25rem;
  padding-right:2.2rem;border-right:3px solid var(--orange)}
.ch-num{font-family:var(--arial);font-size:5.4rem;font-weight:700;line-height:.84;
  color:var(--squid);letter-spacing:-.045em}
:root[data-theme="dark"] .ch-num{color:var(--ink)}
.ch-of{font-size:.48rem;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted)}
.ch-body{flex:1 1 auto;min-width:0;max-width:46rem}
.ch-when{font-size:.58rem;font-weight:700;letter-spacing:1.9px;text-transform:uppercase;
  color:var(--link);margin-bottom:.4rem}
.ch-title{margin:0 0 .75rem;font-size:1.75rem;font-weight:700;line-height:1.08;
  letter-spacing:-.022em;color:var(--squid)}
:root[data-theme="dark"] .ch-title{color:var(--ink)}
.ch-problem{margin:0 0 .55rem;font-size:1rem;font-weight:700;line-height:1.35;color:var(--ink)}
.ch-detail{margin:0 0 .6rem;font-size:.8rem;line-height:1.5;color:var(--ink-2)}
.ch-next{margin:0;font-size:.78rem;line-height:1.45;color:var(--blue);font-weight:700;
  border-left:3px solid var(--orange);padding-left:.75rem}
@media (max-width:900px){
  .chapter{flex-direction:column;align-items:flex-start;gap:1rem}
  .ch-rail{flex-direction:row;align-items:baseline;border-right:none;
    border-bottom:4px solid var(--orange);padding:0 0 .4rem;gap:.7rem}
  .ch-num{font-size:3rem}}

/* ================= chapter chip in the masthead ================= */


/* ================= notes / overview / zoom ================= */
#notes::-webkit-scrollbar,#ov::-webkit-scrollbar{width:0;height:0}
#notes,#ov{scrollbar-width:none}
#notes{position:fixed;left:0;right:0;bottom:0;z-index:40;transform:translateY(101%);
  transition:transform .28s ease;background:var(--navy);color:#eaf3fa;
  border-top:3px solid var(--gold);padding:14px 24px 16px;max-height:46vh;overflow-y:auto}
#notes.open{transform:none}
#notes h6{margin:0 0 6px;font-size:.5rem;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold)}
#notes .say{font-family:var(--news);font-size:.82rem;line-height:1.55;max-width:66rem}
#notes .say b{color:var(--gold);font-weight:700}
#notes .nxt{margin-top:8px;font-size:.5rem;color:#8fabc2;font-family:var(--mono)}

#ov{position:fixed;inset:0;z-index:50;background:var(--bg);padding:28px;display:none;overflow-y:auto}
#ov.open{display:block}
#ov h3{margin:0 0 16px;font-family:var(--serif);font-size:.86rem;font-weight:700;color:var(--navy);letter-spacing:0;text-transform:none}
.ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:10px}
.ovc{padding:11px 13px;border-radius:0;border:1px solid var(--line);border-top:3px solid var(--line);
  cursor:pointer;background:var(--panel);transition:.15s}
.ovc:hover{border-top-color:var(--orange)}
.ovc-ch{background:var(--squid);border-color:var(--squid);border-top-color:var(--orange)}
.ovc-ch .t{color:#fff}.ovc-ch .i{color:var(--orange)}
.ovc .i{font-family:var(--mono);font-size:.45rem;color:var(--blue);font-weight:700}
.ovc .t{font-family:var(--serif);font-size:.7rem;font-weight:700;margin-top:4px;line-height:1.2}

#zoom{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);z-index:60;
  padding:.9rem 1.5rem;border-radius:0;border:2px solid var(--orange);background:var(--panel);
  color:var(--squid);font-family:var(--mono);font-size:1.5rem;font-weight:700;opacity:0;
  pointer-events:none;transition:opacity .18s,transform .18s;box-shadow:var(--shadow)}
#zoom.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#zoom small{display:block;font-size:.42em;color:var(--muted);font-weight:400;margin-top:.3rem;text-align:center}

:root:fullscreen main{padding:22px 34px}
:root:fullscreen header{padding-top:13px;padding-bottom:13px}

@media (max-width:900px){ header,main,footer{padding-left:14px;padding-right:14px} }
</style>
</head>
<body>
<div id="app">
  <aside class="rail">
    <div class="rail-lecture">Lecture 13<b>Database Optimization</b></div>
    <nav class="rail-nav" id="railNav"></nav>
    <div class="rail-foot">
      <button class="present" id="btnFull" title="Full screen (F)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/>
        </svg><span id="btnFullTxt">Present</span></button>
      <div class="rail-meta"><span id="stepCount">—</span><span class="clock" id="clock">00:00</span></div>
      <div class="rail-keys"><kbd>&rarr;</kbd><kbd>&larr;</kbd> step &nbsp;<kbd>S</kbd> notes
        &nbsp;<kbd>O</kbd> map &nbsp;<kbd>T</kbd> theme &nbsp;<kbd>+</kbd><kbd>&minus;</kbd> size</div>
    </div>
  </aside>

  <section class="doc">
    <div class="doc-head">
      <div class="eyebrow" id="sEyebrow">—</div>
      <h1 class="slide-title" id="sTitle">—</h1>
      <div class="kick" id="sKick"></div>
    </div>
    <main id="stage"></main>
    <div class="progress"><span id="progFill"></span></div>
  </section>
</div>

<div id="notes"><h6>Speaker notes</h6><div class="say" id="noteSay">—</div><div class="nxt" id="noteNxt"></div></div>
<div id="zoom"></div>
<div id="ov"><h3>Run of show</h3><div class="ovgrid" id="ovGrid"></div></div>
<script>
/* =====================================================================
   Motion scenes — inline SVG infographics.
   Every scene takes the current step and returns markup; entrance
   animations are CSS classes, so a re-render replays only what changed.
   ===================================================================== */
/* ---- line-art icon set — stroked, inherits colour, reads at projector size ---- */
const ICON = {
  server:  'M3 4h18v6H3zM3 14h18v6H3zM7 7h.01M7 17h.01',
  db:      'M12 3c4.4 0 8 1.3 8 3s-3.6 3-8 3-8-1.3-8-3 3.6-3 8-3M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3',
  lock:    'M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4',
  grid:    'M3 3h18v18H3zM3 9h18M9 3v18',
  search:  'M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16M21 21l-4.3-4.3',
  users:   'M16 19v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1M9 7a3 3 0 1 0 0 6 3 3 0 0 0 0-6M22 19v-1a4 4 0 0 0-3-3.9',
  cart:    'M2 3h2l2.4 12.5a2 2 0 0 0 2 1.5h9.7a2 2 0 0 0 2-1.6L21 7H6M9.5 21a1 1 0 1 0 0-2 1 1 0 0 0 0 2M18 21a1 1 0 1 0 0-2 1 1 0 0 0 0 2',
  bolt:    'M13 2 3 14h8l-1 8 10-12h-8z',
  trash:   'M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14',
  layers:  'M12 2 2 7l10 5 10-5zM2 12l10 5 10-5M2 17l10 5 10-5',
  ban:     'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18M5.6 5.6l12.8 12.8',
  sigma:   'M18 5H6l6 7-6 7h12',
  clock:   'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18M12 7v5l3 2',
  build:   'M3 21h18M5 21V7l7-4 7 4v14M9 21v-5h6v5',
  route:   'M6 3v12a3 3 0 0 0 3 3h9M15 15l3 3-3 3',
  shield:  'M12 3l8 3v6c0 5-3.5 8.3-8 9.5C7.5 20.3 4 17 4 12V6z',
  split:   'M6 3v6a3 3 0 0 0 3 3h9M6 21v-6a3 3 0 0 1 3-3M15 9l3 3-3 3',
  gauge:   'M12 21a9 9 0 1 1 9-9M12 12l5-3'
};
const ico = (n, c='currentColor') =>
  `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round"><path d="${ICON[n]||ICON.db}"/></svg>`;

/* ---- motion helpers -------------------------------------------------
   wire() draws a connector AND sends packets riding along it, so a query
   is visibly travelling rather than implied by a dashed line.          */
let flowSeq = 0;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
function wire(d, o = {}){
  const id  = 'fp' + (++flowSeq);
  const col = o.color || 'var(--blue)';
  const dur = o.dur || 1.8;
  const n   = o.packets == null ? 1 : o.packets;
  const cls = 'wire' + (o.live === false ? '' : ' live') + (o.cls ? ' ' + o.cls : '');
  let g = `<path id="${id}" d="${d}" class="${cls}"${o.stroke ? ` stroke="${o.stroke}"` : ''}/>`;
  if(!REDUCED) for(let i = 0; i < n; i++){
    g += `<circle r="${o.r || 5}" fill="${col}" class="packet">
      <animateMotion dur="${dur}s" repeatCount="indefinite"
        begin="${((o.delay || 0) + i * dur / n).toFixed(2)}s" rotate="auto">
        <mpath href="#${id}" xlink:href="#${id}"/></animateMotion></circle>`;
  }
  return g;
}

const SV = (vb, inner) => `<svg class="scene" viewBox="${vb}" preserveAspectRatio="xMidYMid meet">${inner}</svg>`;
const D  = n => `style="animation-delay:${n}ms"`;

/* ---- 1. the five-level stack, as a building ---- */
const LEVELS = [   /* index 0 sits at the bottom: System is the foundation */
  {n:'01', t:'System Level',      d:'Data across machines \u00b7 compute & network', k:'Sharding',                 c:'var(--accent)', i:'server'},
  {n:'02', t:'Storage Level',     d:'Data layout on disk within one instance',  k:'Partitioning',             c:'var(--teal)',   i:'db'},
  {n:'03', t:'Transaction Level', d:'Safe concurrent reads & writes',           k:'MVCC \u00b7 Locking',           c:'var(--violet)', i:'lock'},
  {n:'04', t:'Schema Level',      d:'Table & index design',                     k:'Normalization \u00b7 Indexing', c:'var(--violet)', i:'grid'},
  {n:'05', t:'Query Level',       d:'How each SQL statement is written',        k:'SQL & plan tuning',        c:'var(--violet)', i:'search'}
];
function sceneStack(step, focus, compact){
  /* Compact mode is taller and narrower so it fills a half-width column instead
     of shrinking to fit. Everything inside a row is a fraction of the row
     height, so the two modes share one layout. */
  const fh   = compact ? 104 : 66;
  const gap  = compact ? 16  : 9;
  const k    = fh / 66;                       // type scale
  const x    = compact ? 26  : 170;
  const w    = compact ? 948 : 660;
  const base = compact ? 636 : 372;
  const VB   = compact ? '0 0 1000 700' : '0 0 1000 420';
  const px   = n => Math.round(n * k * 10) / 10;   // a NUMBER: these get added to x
  let g='';
  LEVELS.forEach((L,i)=>{
    const y = base - (i+1)*(fh+gap);
    if(step < i+1) return;
    const lit = focus === i+1;
    const fill = lit ? L.c : 'var(--panel)';
    const tc   = lit ? '#fff' : 'var(--ink)';
    const sc   = lit ? 'rgba(255,255,255,.82)' : 'var(--muted)';
    g += `<g class="sv-rise" ${D(i*90)}>
      <rect x="${x}" y="${y}" width="${w}" height="${fh}" rx="${px(10)}" fill="${fill}"
            stroke="${lit?'none':'var(--line)'}" stroke-width="1.5" ${lit?'class="sv-glow"':''}/>
      <rect x="${x}" y="${y+fh*0.17}" width="5" height="${fh*0.66}" rx="2.5" fill="${L.c}"
            opacity="${lit?'.8':'1'}"/>
      <circle cx="${x+px(44)}" cy="${y+fh/2}" r="${px(19)}"
              fill="${lit?'rgba(255,255,255,.22)':'var(--bg)'}"
              stroke="${lit?'rgba(255,255,255,.4)':'var(--line)'}"/>
      <g transform="translate(${x+px(44)-px(11)} ${y+fh/2-px(11)}) scale(${(0.92*k).toFixed(2)})"
         stroke="${lit?'#fff':L.c}" fill="none" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round"><path d="${ICON[L.i]}"/></g>
      <text class="t-serif" x="${x+px(80)}" y="${y+fh*0.65}"
            style="fill:${lit?'#fff':L.c};font-size:${px(24)}px">${L.n}</text>
      <text class="t-serif" x="${x+px(132)}" y="${y+fh*0.44}"
            style="fill:${tc};font-size:${px(18)}px">${L.t}</text>
      <text x="${x+px(132)}" y="${y+fh*0.74}"
            style="fill:${sc};font-size:${px(14)}px">${L.d}</text>
      <text class="t-mono" x="${x+w-px(20)}" y="${y+fh*0.62}" text-anchor="end"
            style="fill:${lit?'#fff':'var(--accent-deep)'};font-size:${px(15)}px">${L.k}</text>
    </g>`;
  });
  g += `<g class="sv-fade">
    <rect x="${x-px(14)}" y="${base+px(4)}" width="${w+px(28)}" height="${px(12)}" rx="${px(6)}"
          fill="var(--ink)" opacity=".8"/>
    <text x="${x+w/2}" y="${base+px(36)}" text-anchor="middle"
      style="font-style:italic;font-size:${px(16)}px;fill:var(--muted)">the hardware it all stands on</text></g>`;
  if(step>=6 && !compact) g += `<g class="sv-fade">
    <path d="M110 ${base-5*(fh+gap)-10} L110 ${base}" class="wire live"/>
    <text x="98" y="${base-5*(fh+gap)/2}" text-anchor="end"
          transform="rotate(-90 98 ${base-5*(fh+gap)/2})"
          style="font-size:15px;font-weight:700;fill:var(--accent-deep);font-style:italic">built from the foundation up</text></g>`;
  return SV(VB, g);
}

/* ---- what each level owns, shown beside the stack ---- */
const LEVEL_DETAIL = {
 1:{owns:'How data and traffic are spread across physical machines.',
    tech:'Sharding · read replicas',
    symptom:'The whole system is slow, not one query. CPU pinned, or a single primary cannot absorb the writes.',
    fix:'Add machines and split the data across them.',
    cost:'Joins move into application memory; re-sharding is expensive; operations multiply.',
    when:'Today · chapter 3', cls:''},
 2:{owns:'How bytes are physically laid out inside one instance.',
    tech:'Partitioning · clustering · VACUUM',
    symptom:'One table dominates, and a query for one month reads five years of it.',
    fix:'Split the table on the key the query already filters on — usually time.',
    cost:'No pruning unless you filter on the partition key.',
    when:'Today · chapter 6', cls:'tl'},
 3:{owns:'Correctness when many users read and write at the same time.',
    tech:'MVCC · locking · isolation levels',
    symptom:'Throughput collapses while the CPU sits idle — sessions are waiting, not working.',
    fix:'Right isolation level, consistent lock order, retry on 40001 and 40P01.',
    cost:'Stronger isolation means more aborted transactions to retry.',
    when:'Next lecture', cls:'pp'},
 4:{owns:'How tables, types, constraints and indexes are designed.',
    tech:'Normalization · indexing',
    symptom:'A sequential scan over a large table for a filter that matches very few rows.',
    fix:'The right index type, on the right columns, in the right order.',
    cost:'Every index slows every insert, update and delete.',
    when:'A later lecture', cls:'pp'},
 5:{owns:'How one individual SQL statement is written and planned.',
    tech:'EXPLAIN · join order · early filtering',
    symptom:'The system is healthy and one query is slow.',
    fix:'Read the plan. The gap between estimated and actual rows is the tell.',
    cost:'Nothing structural — this is the cheapest level to fix.',
    when:'A later lecture', cls:'pp'}
};

function levelPanel(n){
  const L = LEVELS[n-1], d = LEVEL_DETAIL[n];
  if(!L || !d) return '';
  const row = (k,v,c='') => `<div class="lp-row ${c}"><div class="lp-k">${k}</div><div class="lp-v">${v}</div></div>`;
  return `<div class="lp pop">
    <div class="lp-head">
      <span class="lp-ico">${ico(L.i)}</span>
      <div><div class="lp-n">Level ${L.n}</div><div class="lp-t">${L.t}</div></div>
      <span class="lp-when">${d.when}</span>
    </div>
    <p class="lp-owns">${d.owns}</p>
    ${row('Technique','<span class="mono">'+d.tech+'</span>')}
    ${row('You see','${SYM}'.replace('${SYM}', d.symptom),'warn')}
    ${row('You do', d.fix,'good')}
    ${row('It costs', d.cost)}
  </div>`;
}

/* ---- 2. load growth: counters + a curve that bends ---- */
function sceneGrowth(step){
  const pts = 'M80,330 C220,326 330,318 430,300 C540,280 620,236 700,168 C760,116 800,74 860,46';
  let g = `<path d="${pts}" fill="none" stroke="var(--line)" stroke-width="3"/>`;
  if(step>=1) g += `<path d="${pts}" fill="none" stroke="var(--blue)" stroke-width="4" stroke-linecap="round"
      class="sv-draw" style="--len:1000"/>`;
  if(step>=1) g += `<g class="sv-pop" ${D(700)}><circle cx="80" cy="330" r="8" fill="var(--green)"/>
      <text class="t-sub" x="80" y="360" text-anchor="middle">1995 · one database</text></g>`;
  if(step>=2) g += `<g class="sv-pop" ${D(180)}><circle cx="860" cy="46" r="11" fill="var(--red)" class="sv-hot"/>
      <text class="t-lbl" x="860" y="24" text-anchor="middle" style="fill:var(--red)">timeouts</text>
      <text class="t-sub" x="866" y="76" text-anchor="middle">today</text></g>`;
  if(step>=3) g += `<g class="sv-fade"><text class="t-sub" x="470" y="200" text-anchor="middle"
      style="font-style:italic;font-size:17px;fill:var(--muted)">
      the curve nobody watched until it was vertical</text></g>`;
  return SV('0 0 1000 376', g);
}

/* ---- 3. scale up, and the ceiling ---- */
function sceneScaleUp(step){
  const sizes = [[0,90,70],[1,130,104],[2,176,140],[3,214,176]];
  const cur = Math.min(step,3);
  const [,w,h] = sizes[cur];
  const cx=300, base=330;
  let g = `<line x1="80" y1="86" x2="520" y2="86" stroke="var(--red)" stroke-width="4" stroke-dasharray="10 8"/>
    <text class="t-lbl" x="300" y="70" text-anchor="middle" style="fill:var(--red)">the ceiling — biggest box money can buy</text>`;
  g += `<g style="transition:all .5s cubic-bezier(.22,1,.36,1)">
    <rect x="${cx-w/2}" y="${base-h}" width="${w}" height="${h}" rx="2"
          class="box-navy" ${step>=3?'':''}/>
    <text class="on-navy t-lbl" x="${cx}" y="${base-h/2-4}" text-anchor="middle" style="font-size:16px">1 server</text>
    <text x="${cx}" y="${base-h/2+18}" text-anchor="middle" class="t-sub" style="fill:rgba(255,255,255,.75)">
      ${['16 cores','32 cores','64 cores','128 cores · maxed'][cur]}</text>
  </g>`;
  g += `<text class="t-sub" x="${cx}" y="${base+28}" text-anchor="middle">Vertical scaling · buy a bigger machine</text>`;
  if(step>=3){
    g += `<g class="sv-pop"><rect x="${cx-w/2}" y="${base-h-16}" width="${w}" height="16" rx="1" fill="var(--red)" class="sv-hot"/>
      <text class="on-navy" x="${cx}" y="${base-h-4}" text-anchor="middle" style="font-size:14px;font-weight:700">100% · no room left</text></g>`;
  }
  // right side commentary
  const notes = [
    ['+ Simple','No application-code changes at all.','var(--green)'],
    ['− Finite','One machine can only store and serve so much.','var(--red)'],
    ['− Costly','Past a point a bigger box is not economical.','var(--red)']
  ];
  notes.forEach((n,i)=>{ if(step>=i+1)
    g += `<g class="sv-rise" ${D(i*90)}>
      <rect x="580" y="${112+i*74}" width="360" height="58" rx="2" fill="var(--panel)" stroke="var(--line)"/>
      <rect x="580" y="${112+i*74}" width="5" height="58" rx="2.5" fill="${n[2]}"/>
      <text class="t-lbl" x="600" y="${134+i*74}" style="fill:${n[2]}">${n[0]}</text>
      <text class="t-sub" x="600" y="${154+i*74}">${n[1]}</text></g>`;
  });
  return SV('0 0 1000 380', g);
}

/* ---- 4. scale out: one box becomes many ---- */
function sceneScaleOut(step){
  let g='';
  g += `<g><rect x="60" y="150" width="150" height="120" rx="2" class="box-navy"/>
    <text class="on-navy t-lbl" x="135" y="196" text-anchor="middle">1 huge</text>
    <text class="on-navy t-lbl" x="135" y="218" text-anchor="middle">server</text>
    <text x="135" y="246" text-anchor="middle" class="t-sub" style="fill:rgba(255,255,255,.7)">1B rows · maxed</text></g>`;
  if(step>=1) g += `<g class="sv-fade">${wire('M232 210 L300 210', {dur:1.1, r:4.5})}
    <text class="t-sub" x="266" y="196" text-anchor="middle" style="fill:var(--blue)">shard</text></g>`;
  if(step>=2) for(let i=0;i<5;i++){
    const x = 330 + i*128;
    g += `<g class="sv-pop" ${D(i*110)}>
      <rect x="${x}" y="152" width="108" height="116" rx="2" class="box-blue"/>
      <text class="on-navy t-lbl" x="${x+54}" y="200" text-anchor="middle">S${i+1}</text>
      <text x="${x+54}" y="224" text-anchor="middle" class="t-sub" style="fill:rgba(255,255,255,.8)">200M rows</text>
      <text x="${x+54}" y="244" text-anchor="middle" class="t-sub" style="fill:rgba(255,255,255,.8)">full speed</text></g>`;
  }
  if(step>=3) g += `<g class="sv-rise"><rect x="330" y="290" width="620" height="46" rx="2" fill="var(--panel)" stroke="var(--line)"/>
    <text class="t-lbl" x="640" y="319" text-anchor="middle">Horizontal scaling — each node holds ~1/5 of the data and serves it at full speed</text></g>`;
  g += `<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
    <path d="M0,0 L9,4.5 L0,9 z" fill="var(--blue)"/></marker></defs>`;
  return SV('0 0 1000 360', g);
}

/* ---- 5. split by customer_id ---- */
function sceneShardSplit(step){
  let g='';
  const servers = [['Server 1','1 — 100M'],['Server 2','100M — 200M'],['Server 3','200M — 300M'],['Server 10','900M — 1B']];
  if(step>=1) g += `<g class="sv-rise"><rect x="330" y="26" width="340" height="52" rx="2" class="box-navy"/>
    <text class="on-navy t-lbl" x="500" y="49" text-anchor="middle">orders</text>
    <text x="500" y="68" text-anchor="middle" class="t-sub" style="fill:rgba(255,255,255,.75)">1,000,000,000 rows</text></g>`;
  if(step>=2) servers.forEach((sv,i)=>{
    const x = 55 + i*240 , skip = i===3;
    g += `<g class="sv-pop" ${D(i*120)}>
      ${wire(`M500 84 C500 130 ${x+100} 120 ${x+100} 168`, {dur:1.9, delay:i*.2, r:4.5})}
      <rect x="${x}" y="172" width="200" height="96" rx="2" class="box-navy"/>
      <text class="on-navy t-lbl" x="${x+16}" y="206" style="font-size:16px">${sv[0]}</text>
      <text class="t-mono" x="${x+16}" y="236" style="fill:var(--blue-300)">customer_id</text>
      <text class="t-mono" x="${x+16}" y="254" style="fill:#fff">${sv[1]}</text></g>`;
  });
  if(step>=2) g += `<text class="t-big" x="748" y="228" text-anchor="middle" style="fill:var(--muted)">· · ·</text>`;
  if(step>=3) g += `<g class="sv-rise"><rect x="55" y="292" width="890" height="54" rx="2" fill="var(--panel)"
      stroke="var(--line)"/><rect x="55" y="292" width="5" height="54" rx="2.5" fill="var(--blue)"/>
    <text class="t-lbl" x="78" y="316">No single machine can index and serve 1 billion rows at speed.</text>
    <text class="t-sub" x="78" y="336">With sharding each server handles one tenth — and serves its share at full speed.</text></g>`;
  return SV('0 0 1000 360', g);
}

/* ---- 6. anatomy: app → router → shards, with a live query packet ---- */
function sceneAnatomy(step){
  let g='';
  g += `<g class="sv-rise"><rect x="390" y="20" width="220" height="52" rx="2" class="box-navy"/>
    <text class="on-navy t-lbl" x="500" y="52" text-anchor="middle">Application</text></g>`;
  if(step>=1) g += step>=3 ? wire('M500 74 L500 122', {dur:1.1, r:5.5})
                          : `<path d="M500 74 L500 122" class="wire"/>`;
  if(step>=1) g += `<g class="sv-pop"><rect x="352" y="124" width="296" height="56" rx="2" class="box-blue ${step>=3?'sv-glow':''}"/>
    <text class="on-navy t-lbl" x="500" y="152" text-anchor="middle" style="font-size:17px">Shard Router</text>
    <text x="500" y="170" text-anchor="middle" class="t-sub" style="fill:rgba(255,255,255,.85)">knows which shard holds which key</text></g>`;
  if(step>=2) [0,1,2].forEach(i=>{
    const x = 200 + i*250;
    const hit = step>=3 && i===1;
    g += `<g class="sv-pop" ${D(i*110)}>
      ${hit ? wire(`M500 182 C500 214 ${x+90} 206 ${x+90} 238`, {dur:1.1, delay:.55, r:5.5})
             : `<path d="M500 182 C500 214 ${x+90} 206 ${x+90} 238" class="wire"/>`}
      <rect x="${x}" y="240" width="180" height="76" rx="2" fill="${hit?'var(--blue)':'var(--navy-700)'}"
            ${hit?'class="sv-glow"':''}/>
      <text class="on-navy t-lbl" x="${x+90}" y="272" text-anchor="middle">Shard ${i+1}</text>
      <text x="${x+90}" y="294" text-anchor="middle" class="t-sub" style="fill:rgba(255,255,255,.75)">own CPU · disk · network</text></g>`;
  });
  if(step>=3) g += `<g class="sv-fade"><rect x="640" y="124" width="300" height="56" rx="2" fill="var(--panel)" stroke="var(--blue)"/>
    <text class="t-mono" x="660" y="148" style="font-size:13px">WHERE customer_id = 142857</text>
    <text class="t-sub" x="660" y="167" style="fill:var(--blue)">→ one targeted lookup on Shard 2</text></g>`;
  return SV('0 0 1000 340', g);
}

/* ---- 7. range-based sharding ---- */
function sceneRange(step){
  const shards = [['Shard 1','id 1 — 1,000,000'],['Shard 2','id 1,000,001 — 2,000,000'],['Shard 3','id 2,000,001 +']];
  let g='';
  shards.forEach((sh,i)=>{ if(step<1) return;
    const x = 60 + i*310;
    const hit = step>=2 && i===0;
    g += `<g class="sv-rise" ${D(i*110)}>
      <rect x="${x}" y="120" width="280" height="104" rx="2" fill="var(--panel)"
            stroke="${hit?'var(--blue)':'var(--line)'}" stroke-width="${hit?3:1.5}" ${hit?'class="sv-glow"':''}/>
      <rect x="${x}" y="120" width="280" height="6" rx="3" fill="var(--blue)"/>
      <text class="t-lbl" x="${x+20}" y="162" style="fill:var(--blue);font-size:17px">${sh[0]}</text>
      <text class="t-mono" x="${x+20}" y="192">${sh[1]}</text></g>`;
  });
  if(step>=2) g += `<g class="sv-fade"><rect x="60" y="30" width="880" height="56" rx="2" class="box-navy"/>
    <text class="t-mono" x="84" y="56" style="fill:#9FD0FF;font-size:14px">SELECT * FROM orders WHERE id BETWEEN 500000 AND 600000;</text>

  if(step>=3) g += `<g class="sv-rise"><rect x="60" y="252" width="430" height="66" rx="2" fill="var(--panel)" stroke="var(--line)"/>

/* ---- 8. hash-based sharding: the modulo, computed on screen ---- */
function sceneHash(step){
  const rows = [['1001','1'],['1002','2'],['1003','3'],['1004','0']];
  let g = `<text class="t-mono" x="60" y="42" style="font-size:15px;fill:var(--blue)">id mod 4</text>`;

  });

    const tgt = parseInt(r[1],10);
    const ex = 430 + tgt*138 + 7;          // top-centre of the destination shard
    g += wire(`M280 ${86+i*44} C350 ${86+i*44} ${ex-70} ${86+i*44} ${ex} 148`,
              {dur:1.7, delay:i*.22, r:4.5});

    const x = 430 + i*138, filled = step>=2;

      <rect x="${x-52}" y="152" width="118" height="92" rx="2" fill="${filled?'var(--blue)':'var(--navy-700)'}"/>

  if(step>=3) g += `<g class="sv-rise"><rect x="60" y="272" width="430" height="66" rx="2" fill="var(--panel)" stroke="var(--line)"/>

    <rect x="510" y="272" width="5" height="66" rx="2.5" fill="var(--red)"/>

    <text class="t-sub" x="532" y="320">Order is destroyed, so a range query must hit every shard.</text></g>`;
  return SV('0 0 1000 356', g);
}

/* ---- 9. directory-based sharding ---- */

/* ---- 10. hotspot bar chart (order_date as shard key) ---- */

/* ---- 12. re-sharding ---- */
function sceneReshard(step){

/* ---- 13. the full-table-scan problem ---- */
function sceneScan(step){
  let g='';
  const COLS=20, CW=42, CH=30, X0=70, Y0=96;
  for(let i=0;i<60;i++){
    const x=X0+(i%COLS)*CW, y=Y0+Math.floor(i/COLS)*(CH+6);
    const scanned = step>=1, target = step>=2 && i===12;
    g += `<rect x="${x}" y="${y}" width="${CW-5}" height="${CH}" rx="1"
      fill="${target?'var(--blue)':(scanned?'color-mix(in srgb,var(--red) 26%,transparent)':'var(--panel)')}"
      stroke="var(--line)" ${scanned&&!target?`class="sv-fade" ${D(i*8)}`:''} ${target?'class="sv-glow"':''}/>`;
  }
  g += `<text class="t-sub" x="${X0}" y="80" style="font-weight:600">orders — one cell per month · 60 months · 150M rows</text>`;
  if(step===1 && !REDUCED){                    // the scan head sweeping the table
    const wpx = COLS*CW;
    g += `<g class="sv-sweep" style="--sweep:${wpx-40}px">
      <rect x="${X0}" y="${Y0-4}" width="34" height="${3*(CH+6)}" rx="2"
            fill="var(--red)" opacity=".22"/>
      <rect x="${X0+15}" y="${Y0-4}" width="3" height="${3*(CH+6)}" fill="var(--red)" opacity=".8"/></g>`;
  }
  if(step>=2) g += `<g class="sv-pop"><path d="M${X0+12*CW-3} ${Y0-8} L${X0+12*CW-3} ${Y0-26}" class="wire live"/>
    <text class="t-sub" x="${X0+12*CW-3}" y="${Y0-32}" text-anchor="middle" style="fill:var(--blue);font-weight:600">Jan 2025</text></g>`;
  // annotations sit BELOW the grid so nothing overlaps the cells
  if(step>=1) g += `<g class="sv-rise"><rect x="${X0}" y="236" width="400" height="62" rx="2" fill="var(--panel)" stroke="var(--line)"/>
    <rect x="${X0}" y="236" width="5" height="62" rx="2.5" fill="var(--red)"/>
    <text class="t-lbl" x="${X0+22}" y="262" style="fill:var(--red);font-size:16px">Without partitioning · 150M rows read</text>
    <text class="t-sub" x="${X0+22}" y="284">Every cell is examined to find the 2–3M that match.</text></g>`;
  if(step>=2) g += `<g class="sv-rise"><rect x="${X0+440}" y="236" width="400" height="62" rx="2" fill="var(--panel)" stroke="var(--blue)" stroke-width="2"/>

  if(step>=3) g += `<g class="sv-rise"><rect x="${X0}" y="312" width="840" height="52" rx="2" class="box-navy"/>

    <text x="${X0+22}" y="356" style="fill:rgba(255,255,255,.8)" class="t-sub">The engine skips the other 59 pieces entirely — that skipping is partition pruning.</text></g>`;
  return SV('0 0 1000 376', g);
}

/* ---- 14. partition pruning in action ---- */
function scenePruning(step){
  const parts=[['orders_2023',0],['orders_2024',1],['orders_2025',2]];
  let g = `<g class="sv-rise"><rect x="60" y="24" width="880" height="52" rx="2" class="box-navy"/>

  parts.forEach(([name,i])=>{
    const x=60+i*300, hit = step>=1 && i===2, skipped = step>=1 && i!==2;
    if(step>=1) g += hit
        ? wire(`M500 80 C500 112 ${x+140} 104 ${x+140} 136`, {dur:1.2, r:5.5})
        : `<path d="M500 80 C500 112 ${x+140} 104 ${x+140} 136" class="wire sv-fade" ${D(i*90)}
             stroke-dasharray="3 7" opacity=".5"/>`;
    g += `<g class="sv-rise" ${D(i*90)}>
      <rect x="${x}" y="138" width="280" height="96" rx="2"
        fill="${hit?'var(--navy-700)':'var(--panel)'}" stroke="${hit?'none':'var(--line)'}"
        opacity="${skipped?.45:1}" ${hit?'class="sv-glow"':''}/>
      <text class="t-mono" x="${x+22}" y="176" style="fill:${hit?'#fff':'var(--muted)'};font-size:15px">${name}${hit?' ✓':''}</text>
      <text class="t-sub" x="${x+22}" y="202" style="fill:${hit?'rgba(255,255,255,.8)':'var(--muted)'}">
        ${hit?'scanned · ~2–3M rows':'skipped'}</text></g>`;
  });
  if(step>=2) g += `<g class="sv-rise"><rect x="60" y="260" width="880" height="50" rx="2" fill="var(--panel)" stroke="var(--line)"/>
    <rect x="60" y="260" width="5" height="50" rx="2.5" fill="var(--blue)"/>
    <text class="t-lbl" x="82" y="290">The scan drops from 150M rows to ~2–3M — the planner never opens the other partitions.</text></g>`;
  return SV('0 0 1000 324', g);
}

function sceneVersus(step){

    });

  if(step>=2){
    g += `<g class="sv-rise"><text class="t-serif" x="750" y="38" text-anchor="middle" style="fill:var(--violet);font-size:23px;font-weight:700">Partitioning</text>
      <text x="750" y="60" text-anchor="middle" style="font-family:var(--news);font-style:italic;font-size:14px;fill:var(--muted)">one machine · a storage-organisation technique</text>

    [0,1,2,3].forEach(i=>{

    });
  }
  if(step>=3) g += `<g class="sv-rise"><rect x="72" y="232" width="420" height="64" rx="2" fill="var(--panel)" stroke="var(--line)"/>
    <rect x="72" y="232" width="5" height="64" rx="2.5" fill="var(--blue)"/>

    <text class="t-sub" x="542" y="278">across storage segments. Solves: this table is too big.</text></g>`;
  return SV('0 0 1000 310', g);
}

{ id:'define', kick:'many instances, one logical database', eyebrow:'Definition', title:'What is sharding?',

  {note:'Read the definition slowly. Horizontally partitioning a database across multiple independent instances, each one called a shard.'},

{ id:'anatomy', kick:'shard · shard key · shard router', eyebrow:'Three components to know', title:'Anatomy of a sharded system',
  tag:'sharding', steps:[
  {note:'The Shard: an independent node with its own CPU, memory, disk and network. It operates independently of the others.'},
  {note:'The Shard Router: sits between the application and the shards. It knows which shard holds which data and routes each query. Middleware, or logic inside your app.'},
  {note:'The Shard Key: the column or columns that decide which shard a row belongs to. This is the single most critical decision in the design — a poor choice gives you imbalanced shards and degradation you cannot tune away.'}],
  body:(st)=>`<div class="stage-row">${sceneAnatomy(st+1)}</div>
    ${st>=2?`<p class="lede pop"><b style="color:var(--red)">Shard Key — the most critical decision.</b>
      The column(s) that decide which shard a row belongs to. A poor choice produces imbalanced shards and degradation.</p>`:''}` },

{ id:'range', kick:'contiguous keys stay together', eyebrow:'Strategy 1 of 3', title:'Range-based sharding',
  tag:'strategies', steps:[
  {note:'Divide into shards by a range of values in the shard-key column. Shard one takes IDs up to a million, shard two the next million, and so on.'},
  {note:'A query for IDs five hundred thousand to six hundred thousand? The router knows it lives entirely on shard one — one targeted lookup.'},
  {note:'Advantage: efficient range queries. Disadvantage: hotspots. If most traffic comes from recent customers, the highest-ID shard is overwhelmed while the earlier ones sit idle.'}],
  body:(st)=>`<div class="stage-row">${sceneRange(st+1)}</div>` },

{ id:'hash', kick:'ordering traded for even distribution', eyebrow:'Strategy 2 of 3', title:'Hash-based sharding',
  tag:'strategies', steps:[
  {note:'Apply a hash function to the shard-key value; the result picks the shard. For four shards, id mod 4 is the simplest possible hash.'},
  {note:'Walk the arithmetic out loud — 1001 mod 4 is 1, so that row goes to shard 1. The consecutive IDs scatter to four different shards.'},
  {note:'Advantage: uniform distribution, no hotspots, regardless of how IDs are generated. Disadvantage: hashing destroys order, so a range query must hit every shard and merge — a scatter-gather.'}],
  body:(st)=>`<div class="stage-row">${sceneHash(st+1)}</div>` },

{ id:'directory', kick:'an explicit key-to-shard map', eyebrow:'Strategy 3 of 3', title:'Directory-based sharding',
  tag:'strategies', steps:[
  {note:'A lookup table — the shard directory — maps each shard-key value to a specific shard. The router consults it on every insert and every query.'},
  {note:'Look up key 1043, the directory says shard 1, the query goes there. Completely explicit.'},
  {note:'Advantage: maximum flexibility — move rows between shards by editing one entry, no re-hashing of anything. Disadvantage: every query consults the directory first, so it is a central bottleneck and a single point of failure.'}],
  body:(st)=>`<div class="stage-row">${sceneDirectory(st+1)}</div>` },

  {note:'Range queries: single shard for range, scatter-gather for hash, depends on layout for directory.'},
  {note:'Rebalancing: re-split ranges, re-hash all data, or edit one entry.'},
  {note:'And the main risk of each — hotspots, costly ranges, central bottleneck. This row is the one to memorise.'}],
  body:(st)=>{
    const rows=[['Distribution','Can be uneven','Uniform','Controlled by table',false],
      ['Range queries','Single shard','Scatter–gather','Depends on layout',false],

      ['Main risk','Hotspots','Costly ranges','Central bottleneck',true]];
    return `<div class="cards" style="gap:.4rem">
      <div style="display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:.5rem;padding:.4rem .7rem;
        background:var(--navy);border-radius:8px;color:#fff;font-size:.6rem;font-weight:700">
        <span></span><span>Range</span><span>Hash</span><span>Directory</span></div>

        grid-template-columns:1.2fr 1fr 1fr 1fr;gap:.5rem;padding:.46rem .7rem;background:var(--panel);border-radius:10px">
